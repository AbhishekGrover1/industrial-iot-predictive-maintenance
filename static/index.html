<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Predictive Maintenance – Abhishek Grover</title>
  <meta name="description" content="Machine fault diagnosis from sensor readings. Built by Abhishek Grover, AI ML Engineer.">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#090d13">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/cormorant-garamond-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/ibm-plex-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body data-state="idle">
  <div class="backdrop" aria-hidden="true">
    <span class="backdrop__grid"></span>
    <span class="backdrop__light"></span>
  </div>

  <main class="page">
    <header class="masthead">
      <h1 class="masthead__name">Abhishek Grover</h1>
      <p class="masthead__role">AI ML Engineer</p>
    </header>

    <div class="scene" id="scene">
      <section class="plate" id="plate" aria-label="Machine diagnostics">
        <span class="plate__sheen" aria-hidden="true"></span>
        <span class="plate__edge" aria-hidden="true"></span>

        <div class="plate__content">
          <form class="form" id="form" autocomplete="off" novalidate>
            <div class="field field--wide" role="radiogroup" aria-labelledby="type-label">
              <span class="label" id="type-label">Machine type</span>
              <div class="segmented">
                <input type="radio" name="type" id="type-l" value="L" checked>
                <label for="type-l">Low</label>
                <input type="radio" name="type" id="type-m" value="M">
                <label for="type-m">Medium</label>
                <input type="radio" name="type" id="type-h" value="H">
                <label for="type-h">High</label>
                <span class="segmented__thumb" aria-hidden="true"></span>
              </div>
            </div>

            <div class="field">
              <label class="label" for="air">Air temperature</label>
              <div class="control">
                <input id="air" name="air_temperature_k" type="number" inputmode="decimal" step="any" min="250" max="350" value="298.1" required>
                <span class="unit">K</span>
              </div>
            </div>

            <div class="field">
              <label class="label" for="process">Process temperature</label>
              <div class="control">
                <input id="process" name="process_temperature_k" type="number" inputmode="decimal" step="any" min="250" max="400" value="308.6" required>
                <span class="unit">K</span>
              </div>
            </div>

            <div class="field">
              <label class="label" for="speed">Rotational speed</label>
              <div class="control">
                <input id="speed" name="rotational_speed_rpm" type="number" inputmode="numeric" step="1" min="1" max="10000" value="1551" required>
                <span class="unit">rpm</span>
              </div>
            </div>

            <div class="field">
              <label class="label" for="torque">Torque</label>
              <div class="control">
                <input id="torque" name="torque_nm" type="number" inputmode="decimal" step="any" min="0.1" max="250" value="42.8" required>
                <span class="unit">Nm</span>
              </div>
            </div>

            <div class="field field--wide">
              <label class="label" for="wear">Tool wear</label>
              <div class="control">
                <input id="wear" name="tool_wear_min" type="number" inputmode="numeric" step="1" min="0" max="1000" value="0" required>
                <span class="unit">min</span>
              </div>
            </div>

            <div class="key-wrap" id="key-wrap">
              <button class="key" id="key" type="submit">
                <span class="key__spinner" aria-hidden="true"></span>
                <span class="key__label">Run Diagnostics</span>
              </button>
            </div>
          </form>

          <div class="readout" id="readout" data-open="false">
            <div class="readout__clip">
              <div class="readout__inner" role="status" aria-live="polite">
                <div class="diagnosis" id="diagnosis" hidden>
                  <p class="diagnosis__verdict" id="verdict"></p>
                  <div class="diagnosis__meta">
                    <div class="meter" aria-hidden="true"><span class="meter__fill" id="meter"></span></div>
                    <p class="diagnosis__confidence"><span class="visually-hidden">Confidence </span><span id="confidence"></span></p>
                  </div>
                </div>
                <p class="notice" id="notice" hidden></p>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>

    <footer class="links">
      <a href="https://github.com/AbhishekGrover1" target="_blank" rel="noopener noreferrer" aria-label="GitHub" title="GitHub">

      </a>
      <a href="https://www.linkedin.com/in/abhishek-grover-07" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn" title="LinkedIn">
        <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M0 1.146C0 .513.526 0 1.175 0h13.65C15.474 0 16 .513 16 1.146v13.708c0 .633-.526 1.146-1.175 1.146H1.175C.526 16 0 15.487 0 14.854zm4.943 12.248V6.169H2.542v7.225zm-1.2-8.212c.837 0 1.358-.554 1.358-1.248-.015-.709-.52-1.248-1.342-1.248S2.4 3.226 2.4 3.934c0 .694.521 1.248 1.327 1.248zm4.908 8.212V9.359c0-.216.016-.432.08-.586.173-.431.568-.878 1.232-.878.869 0 1.216.662 1.216 1.634v3.865h2.401V9.25c0-2.22-1.184-3.252-2.764-3.252-1.274 0-1.845.7-2.165 1.193v.025h-.016l.016-.025V6.169h-2.4c.03.678 0 7.225 0 7.225z"/></svg>
      </a>
    </footer>
  </main>
</body>
</html>
